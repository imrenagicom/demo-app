services:
  fluentbit:
    image: fluent/fluent-bit:5.1.1
    ports:
      - "127.0.0.1:24224:24224"
      - "127.0.0.1:24224:24224/udp"
    volumes:
      - ./scripts/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./scripts/fluentbit/map.json:/fluent-bit/etc/map.json:ro
      - ./logs:/app/logs

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning
      - ./scripts/grafana/dashboards:/etc/grafana/demo-dashboards
      - grafana_data:/var/lib/grafana

  postgres:
    image: postgres:16
    command: postgres -c 'max_connections=1000'
    environment:
      POSTGRES_DB: course
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
    ports:
      - "127.0.0.1:5432:5432"
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data/

  redis:
    image: bitnami/redis:7.0
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/bitnami
    ports:
      - "127.0.0.1:6379:6379"

  loki:
    image: grafana/loki:3.7.7
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./scripts/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/config.yaml

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./scripts/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=5m'
      - '--storage.tsdb.retention.size=10GB'
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  grafana_data:
  postgres:
  redis_data:
  loki_data:
  prometheus_data:
